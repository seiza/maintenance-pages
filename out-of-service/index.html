<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Out of service</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --blue:    #2563EB;
      --bg:      #FFFFFF;
      --text:    #0F172A;
      --muted:   #64748B;
      --border:  #E2E8F0;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:     #0A0F1E;
        --text:   #F8FAFC;
        --muted:  #94A3B8;
        --border: #1E293B;
      }
    }

    :root[data-theme="dark"] {
      --bg:     #0A0F1E;
      --text:   #F8FAFC;
      --muted:  #94A3B8;
      --border: #1E293B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .center {
      text-align: center;
      max-width: 480px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-wrap: balance;
      margin-bottom: 16px;
    }

    h1 span {
      color: var(--blue);
    }

    p {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--muted);
      text-wrap: balance;
    }
  </style>
</head>
<body>

  <main>
    <div class="center">
      <div class="badge">Out of service</div>
      <h1>This site<br><span>is out of service.</span></h1>
      <p>The project is evolving and this site is no longer maintained.<br>Thank you for your interest.</p>
    </div>
  </main>

</body>
</html>
